services:
  db:
    image: postgres:15-alpine
    container_name: cipherlens_db
    environment:
      POSTGRES_USER: cipherlens
      POSTGRES_PASSWORD: cipherlens_password
      POSTGRES_DB: cipherlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipherlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cipherlens_backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://cipherlens:cipherlens_password@db:5432/cipherlens
      - SECRET_KEY=cipherlens-prod-secret-918237198273
      - MASTER_KEY=cipherlens-prod-master-key-32byt # 32 bytes
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cipherlens_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:
